services:
  llm-server:
    # NVIDIA's official vLLM build for CUDA 13 / Thor (sm_110). The dustynv
    # JetPack-6 (CUDA 12.9) image fails on Thor with CUDA error 801.
    image: nvcr.io/nvidia/vllm:26.02-py3
    container_name: vllm-qwen-agent
    runtime: nvidia
    ipc: host
    restart: unless-stopped
    ports:
      # Published on the host loopback only — reachable via the SSH tunnel
      # (ssh -N -L 9999:localhost:9999 thor-box-seqato). Container listens on 9999 too.
      - "127.0.0.1:9999:9999"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      # Optional: Maps an environment variable from your host just in case
      # you ever switch to a gated model like Llama-3 in the future.
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      # Caches the model weights locally on the Thor device so they persist
      # across restarts and don't re-download.
      - ~/.cache/huggingface:/root/.cache/huggingface
    # NGC entrypoint just does `exec "$@"`, so we must provide the full command.
    command: >
      vllm serve "Qwen/Qwen3-8B-AWQ"
      --quantization awq_marlin
      --host 0.0.0.0
      --port 9999
      --gpu-memory-utilization 0.12
      --max-model-len 8192
      --trust-remote-code
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -fsS http://localhost:9999/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s